<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Transfer Match Quiz</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@400;600&display=swap"
    rel="stylesheet"
  >
  <link rel="stylesheet" href="landingpage.css">
</head>
<body>
  <div class="page1">
    <img src="pics/page1_ucsd.png" class="ucsd-logo" alt="UC San Diego logo">
    <img src="pics/page1_logo.png" class="quiz-logo" alt="TransferMatch Quiz logo">
    <img src="pics/page1_kingtriton.png" class="king-triton" alt="King Triton">
    <img src="pics/page1_welcome.png" class="welcome" alt="Welcome Tritons">

    <div class="description">
      <img src="pics/page1_description.png" class="desc-bg" alt="Description box background">

          Welcome to the transfer match quiz! We know that finding a sense of

        <p>Click the button below to begin.</p>
      </div>

      <a href="quiz.html" class="start-link" aria-label="Start Quiz"></a>

      <img src="pics/page1_bear.png" class="bear" alt="Teddy bear mascot">

  </div>
